name: c1-dynamic-cloudflare-tests

on:
  push:
    branches:
      - phase8/c1-dynamic-cloudflare-20261003
    paths:
      - src/**
      - tests/v2/test_cloudflare_dynamic_admission.py
      - .github/workflows/c1-dynamic-cloudflare-tests.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2-dev.txt
      - run: python -m pip install -r requirements-v2-dev.txt
      - run: python -m pytest tests/v2/test_cloudflare_dynamic_admission.py tests/v2/test_model_catalog_expansion.py tests/v2/test_model_catalog_admission.py -q
      - run: python -m compileall -q src
