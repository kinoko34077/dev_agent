name: cloudflare-c1-refresh-canonical-model-evidence

on:
  push:
    branches:
      - phase8/c1-dynamic-cloudflare-20261003
    paths:
      - .github/workflows/cloudflare-c1-refresh-canonical-model-evidence.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/c1-dynamic-cloudflare-20261003
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh only the Cloudflare credential lane
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/cloudflare-bindings.json").write_text(json.dumps({
              "schema_version": 1,
              "bindings": [{
                  "provider_id": "cloudflare",
                  "provider_binding_id": "cloudflare:account",
                  "api_key_env": "CLOUDFLARE_API_TOKEN",
                  "account_id_env": "CLOUDFLARE_ACCOUNT_ID"
              }]
          }), encoding="utf-8")
          PY
          python scripts/refresh_model_catalog.py \
            --bindings /tmp/cloudflare-bindings.json \
            --merge-into spec/v2/model_evidence/model_catalog_snapshot.json \
            --output /tmp/model_catalog_snapshot.json
          cp /tmp/model_catalog_snapshot.json spec/v2/model_evidence/model_catalog_snapshot.json
          python scripts/rebuild_model_evidence.py \
            --catalog spec/v2/model_evidence/model_catalog_snapshot.json \
            --aliases-output spec/v2/model_evidence/model_alias_catalog.json \
            --capabilities-output spec/v2/model_evidence/model_capability_snapshot.json \
            --replace-existing
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("model_catalog_snapshot.json","model_alias_catalog.json","model_capability_snapshot.json"):
              doc=json.loads((Path("spec/v2/model_evidence")/name).read_text())
              print(name, len(doc.get("entries", [])))
          PY
      - name: Commit reviewed-scope evidence refresh
        shell: bash
        run: |
          git config user.name "KiNoTch. evidence refresh"
          git config user.email "79015263+kinoko34077@users.noreply.github.com"
          git add spec/v2/model_evidence/model_catalog_snapshot.json \
                  spec/v2/model_evidence/model_alias_catalog.json \
                  spec/v2/model_evidence/model_capability_snapshot.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "evidence: refresh Cloudflare model identities"
          git push origin HEAD:phase8/c1-dynamic-cloudflare-20261003
