name: cloudflare-evidence-c2

on:
  push:
    branches:
      - phase8/c-cloudflare-evidence-20261003
    paths:
      - .github/workflows/cloudflare-evidence-c2.yml

permissions:
  contents: read

jobs:
  c2-billable-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify credential references are present
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '{"status":"AUTH_REQUIRED","missing":"CLOUDFLARE_API_TOKEN"}'
            exit 2
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '{"status":"AUTH_REQUIRED","missing":"CLOUDFLARE_ACCOUNT_ID"}'
            exit 2
          fi
          echo '{"status":"AUTH_REFERENCES_PRESENT"}'

      - name: C2 read-only billable usage probe
        shell: bash
        run: |
          set +e
          python scripts/probe_cloudflare_billable_usage.py > "$RUNNER_TEMP/cloudflare-c2.json"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/cloudflare-c2-exit.txt"

      - name: Emit sanitized C2 evidence summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          doc = json.loads((root / "cloudflare-c2.json").read_text(encoding="utf-8"))
          rc = int((root / "cloudflare-c2-exit.txt").read_text(encoding="utf-8").strip())

          status = doc.get("status")
          if status != "OBSERVED_RAW":
              allowed = {
                  key: doc.get(key)
                  for key in (
                      "status",
                      "provider",
                      "network_called",
                      "required_permission",
                      "endpoint",
                      "endpoint_status",
                  )
                  if key in doc
              }
              allowed["probe_exit_code"] = rc
              print(json.dumps(allowed, indent=2, sort_keys=True))
              raise SystemExit(rc or 4)

          neuron_records = doc.get("neuron_records", [])
          summary = {
              "status": status,
              "authority": doc.get("authority"),
              "restricted_endpoint": doc.get("restricted_endpoint"),
              "day": doc.get("day"),
              "admission_ready": doc.get("admission_ready"),
              "record_count": len(doc.get("records", [])),
              "neuron_record_count": len(neuron_records),
              "neuron_records": neuron_records,
              "strict_remaining_derived": False,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
