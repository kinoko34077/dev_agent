name: r9-preflight

# Blocking admission-evidence preflight for formal R9 / evidence promotion.
# Run manually on the exact revision to be used. Unlike the warning step in
# v2-core, this job FAILS on an expiry cliff, an exhausted evidence source, or
# a required identity that is not statically ELIGIBLE now and at the horizon.
# Static ELIGIBLE is not runtime admission; Router gates remain separate.

on:
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: Hours ahead that evidence must stay valid
        default: "48"
        required: true
      identity:
        description: Required PROVIDER/BINDING/MODEL identity
        default: gemini/gemini:worker:free-3/gemini-3.5-flash-lite
        required: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2-dev.txt
      - run: python -m pip install -r requirements-v2-dev.txt
      - name: Admission evidence preflight (blocking)
        env:
          HORIZON: ${{ inputs.horizon_hours }}
          IDENTITY: ${{ inputs.identity }}
        run: >-
          python scripts/check_evidence_expiry.py --preflight
          --horizon-hours "$HORIZON" --require-identity "$IDENTITY"
