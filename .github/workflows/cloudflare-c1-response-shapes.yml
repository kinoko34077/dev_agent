name: cloudflare-c1-response-shapes

on:
  push:
    branches:
      - phase8/c1-dynamic-cloudflare-20261003
    paths:
      - .github/workflows/cloudflare-c1-response-shapes.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        model:
          - "@cf/meta/llama-3.1-8b-instruct-fp8"
          - "@cf/zai-org/glm-4.7-flash"
          - "@cf/google/gemma-4-26b-a4b-it"
          - "@cf/nvidia/nemotron-3-120b-a12b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect sanitized response shape
        shell: bash
        run: |
          MODEL='${{ matrix.model }}' python - <<'PY'
          import json, os
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          model=os.environ["MODEL"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          body=json.dumps({"messages":[{"role":"user","content":"Reply with the single word ready."}],"max_tokens":16}).encode()
          req=Request(
              f"https://api.cloudflare.com/client/v4/accounts/{quote(account,safe='')}/ai/run/{quote(model,safe='@/._-')}",
              data=body,
              headers={"Content-Type":"application/json","Authorization":"Bearer "+token},
              method="POST",
          )
          try:
              with urlopen(req,timeout=30) as resp:
                  doc=json.loads(resp.read(1_000_000).decode())
                  status=resp.status
          except HTTPError as exc:
              status=exc.code
              try: doc=json.loads(exc.read(100_000).decode())
              except Exception: doc={}
          def shape(value,depth=0):
              if depth>=3: return type(value).__name__
              if isinstance(value,dict):
                  return {str(k):shape(v,depth+1) for k,v in value.items()}
              if isinstance(value,list):
                  return {"type":"list","length":len(value),"item":shape(value[0],depth+1) if value else None}
              return type(value).__name__
          print(json.dumps({"model":model,"http_status":status,"shape":shape(doc)},sort_keys=True,indent=2))
          PY
