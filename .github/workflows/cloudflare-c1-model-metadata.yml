name: cloudflare-c1-model-metadata

on:
  push:
    branches:
      - phase8/c1-dynamic-cloudflare-20261003
    paths:
      - .github/workflows/cloudflare-c1-model-metadata.yml

permissions:
  contents: read

jobs:
  inspect-model-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect bounded Cloudflare model metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from urllib.request import Request, urlopen

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          if not token or not account:
              print(json.dumps({"status": "AUTH_REQUIRED"}))
              raise SystemExit(2)

          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/models/search?per_page=100"
          req = Request(url, headers={"Accept":"application/json","Authorization":"Bearer " + token}, method="GET")
          with urlopen(req, timeout=20) as response:
              doc = json.loads(response.read(2_000_000).decode("utf-8"))

          rows = doc.get("result")
          if not isinstance(rows, list):
              print(json.dumps({"status":"INVALID_RESPONSE","success":doc.get("success")}))
              raise SystemExit(3)

          key_counts = Counter()
          task_shapes = Counter()
          models = []
          for raw in rows:
              if not isinstance(raw, dict):
                  continue
              key_counts.update(raw.keys())
              name = raw.get("name")
              if not isinstance(name, str) or not name.startswith("@cf/"):
                  continue
              task = raw.get("task")
              if isinstance(task, dict):
                  task_value = task.get("name") or task.get("id") or task.get("type")
                  task_shapes["dict:" + ",".join(sorted(str(k) for k in task.keys())[:16])] += 1
              elif isinstance(task, str):
                  task_value = task
                  task_shapes["str"] += 1
              else:
                  task_value = None
                  task_shapes[type(task).__name__] += 1
              tags = raw.get("tags")
              safe_tags = []
              if isinstance(tags, list):
                  for item in tags[:16]:
                      if isinstance(item, str) and 0 < len(item) <= 80:
                          safe_tags.append(item)
                      elif isinstance(item, dict):
                          candidate = item.get("name") or item.get("id")
                          if isinstance(candidate, str) and 0 < len(candidate) <= 80:
                              safe_tags.append(candidate)
              properties = raw.get("properties")
              property_keys = sorted(str(k) for k in properties.keys())[:32] if isinstance(properties, dict) else []
              scalar = {}
              for key in ("beta","experimental","deprecated","planned_deprecation_date","source","type"):
                  value = raw.get(key)
                  if isinstance(value, (str, bool, int, float)) or value is None:
                      scalar[key] = value
              models.append({
                  "name": name,
                  "task": task_value if isinstance(task_value, str) and len(task_value) <= 120 else None,
                  "tags": safe_tags,
                  "property_keys": property_keys,
                  **scalar,
              })

          print(json.dumps({
              "status":"OBSERVED",
              "success":doc.get("success"),
              "row_count":len(rows),
              "dispatchable_name_count":len(models),
              "top_level_key_counts":dict(sorted(key_counts.items())),
              "task_shapes":dict(sorted(task_shapes.items())),
              "models":sorted(models,key=lambda x:x["name"]),
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY
