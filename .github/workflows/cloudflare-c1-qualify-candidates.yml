# retry-after-current-envelope-fix: 2026-10-03
name: cloudflare-c1-qualify-candidates

on:
  push:
    branches:
      - phase8/c1-dynamic-cloudflare-20261003
    paths:
      - .github/workflows/cloudflare-c1-qualify-candidates.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        model:
          - "@cf/meta/llama-3.1-8b-instruct-fp8"
          - "@cf/zai-org/glm-4.7-flash"
          - "@cf/google/gemma-4-26b-a4b-it"
          - "@cf/nvidia/nemotron-3-120b-a12b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bounded free-tier qualification
        shell: bash
        run: |
          python scripts/qualify_free_provider.py \
            --provider cloudflare \
            --model "${{ matrix.model }}" \
            --binding cloudflare:account \
            --api-key-env CLOUDFLARE_API_TOKEN \
            --quota-domain cloudflare:account \
            --timeout-seconds 30
