name: v2-core

on:
  push:
    branches: [v2/bootstrap]
  pull_request:
    branches: [v2/bootstrap]

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-v2-dev.txt
      - run: python -m pip install -r requirements-v2-dev.txt
      - name: Verify exact checked-out HEAD
        run: python scripts/check_head.py --expected "$GITHUB_SHA"
      - run: mkdir -p artifacts
      - run: python -m pytest tests/v2 -q --junitxml=artifacts/v2-core-junit-${{ matrix.python-version }}.xml
      - name: Compile Python sources
        if: matrix.python-version == '3.11'
        run: python -m compileall -q src recovery
      - name: Upload v2 core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-junit-${{ matrix.python-version }}
          path: artifacts/v2-core-junit-${{ matrix.python-version }}.xml
