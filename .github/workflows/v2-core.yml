name: v2-core

on:
  push:
    branches: [v2/bootstrap]
  pull_request:
    branches: [v2/bootstrap]

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v2-dev.txt
      - name: Verify exact checked-out HEAD
        run: python scripts/check_head.py --expected "$GITHUB_SHA"
      - run: mkdir -p artifacts
      - run: python -m pytest tests/v2 -q --junitxml=artifacts/v2-core-junit.xml
      - run: python -m compileall -q src recovery
      - name: Upload v2 core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-junit
          path: artifacts/v2-core-junit.xml
