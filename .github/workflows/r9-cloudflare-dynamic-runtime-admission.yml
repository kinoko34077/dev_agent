name: r9-cloudflare-dynamic-runtime-admission

on:
  push:
    branches:
      - phase8/r9-runtime-admission-20261003
    paths:
      - .github/workflows/r9-cloudflare-dynamic-runtime-admission.yml

permissions:
  contents: read

jobs:
  runtime-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect bounded Gemma response shape
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from urllib.request import Request
          from uuid import uuid4

          from src.dev_agent.domain.protocol import ModelRequest
          from src.dev_agent.providers.cloudflare.provider import (
              CloudflareWorkersAIHttpProvider,
              _read_bounded,
              urlopen_no_redirect,
          )

          model = "@cf/google/gemma-4-26b-a4b-it"
          provider = CloudflareWorkersAIHttpProvider(model=model, timeout_seconds=30)
          request = ModelRequest(
              task_id=str(uuid4()),
              messages=[{"role": "user", "content": "Reply with the single word ready."}],
              requested_capabilities=["text"],
              max_output_tokens=32,
              cost_ceiling=0.0,
          )
          account_id, api_token = provider._credentials()
          body = json.dumps(provider._payload(request), ensure_ascii=False).encode("utf-8")
          http_request = Request(
              f"{provider.base_url}/accounts/{quote(account_id, safe='')}/ai/run/{quote(model, safe='@/._-')}",
              data=body,
              headers={"Content-Type":"application/json","Authorization":"Bearer " + api_token},
              method="POST",
          )
          with urlopen_no_redirect(http_request, timeout=30) as response:
              raw = json.loads(_read_bounded(response).decode("utf-8"))

          result = raw.get("result") if isinstance(raw, dict) else None
          choices = result.get("choices") if isinstance(result, dict) else None
          first_choice = choices[0] if isinstance(choices, list) and choices and isinstance(choices[0], dict) else None
          message = first_choice.get("message") if isinstance(first_choice, dict) and isinstance(first_choice.get("message"), dict) else None
          response_value = result.get("response") if isinstance(result, dict) else None
          output_value = result.get("output") if isinstance(result, dict) else None

          def type_name(value):
              return type(value).__name__

          summary = {
              "status":"OBSERVED_SHAPE",
              "root_keys": sorted(raw.keys()) if isinstance(raw, dict) else [],
              "result_type": type_name(result),
              "result_keys": sorted(result.keys()) if isinstance(result, dict) else [],
              "response_type": type_name(response_value),
              "response_keys": sorted(response_value.keys()) if isinstance(response_value, dict) else [],
              "output_type": type_name(output_value),
              "output_keys": sorted(output_value.keys()) if isinstance(output_value, dict) else [],
              "choices_type": type_name(choices),
              "choices_len": len(choices) if isinstance(choices, list) else None,
              "first_choice_keys": sorted(first_choice.keys()) if isinstance(first_choice, dict) else [],
              "message_keys": sorted(message.keys()) if isinstance(message, dict) else [],
              "message_content_type": type_name(message.get("content")) if isinstance(message, dict) else None,
              "message_content_length": len(message.get("content")) if isinstance(message, dict) and isinstance(message.get("content"), str) else None,
              "reasoning_content_type": type_name(message.get("reasoning_content")) if isinstance(message, dict) else None,
              "reasoning_content_length": len(message.get("reasoning_content")) if isinstance(message, dict) and isinstance(message.get("reasoning_content"), str) else None,
              "finish_reason": first_choice.get("finish_reason") if isinstance(first_choice, dict) and isinstance(first_choice.get("finish_reason"), str) else None,
              "usage_keys": sorted(result.get("usage").keys()) if isinstance(result, dict) and isinstance(result.get("usage"), dict) else [],
              "completion_tokens": result.get("usage", {}).get("completion_tokens") if isinstance(result, dict) and isinstance(result.get("usage"), dict) and isinstance(result.get("usage", {}).get("completion_tokens"), int) else None,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
