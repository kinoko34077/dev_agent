name: r9-cloudflare-dynamic-runtime-admission

on:
  push:
    branches:
      - phase8/r9-runtime-admission-20261003
    paths:
      - .github/workflows/r9-cloudflare-dynamic-runtime-admission.yml

permissions:
  contents: read

jobs:
  runtime-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_AGENT_ENABLE_CONFIGURED_POOL: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select current Cloudflare route without generation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from src.dev_agent.operation import OperationConfig, OperationService
          from src.dev_agent.resources.router import RouteRequest

          with TemporaryDirectory(prefix="r9-cloudflare-select-") as directory:
              service = OperationService.open(
                  OperationConfig.from_environment(data_dir=Path(directory))
              )
              try:
                  snapshot = service.ledger.routing_snapshot()
                  cloudflare_resources = [
                      resource for resource in snapshot.resources
                      if resource.get("provider_id") == "cloudflare"
                  ]
                  selection = service.dispatcher.control.router.choose(
                      RouteRequest(
                          capabilities={"text"},
                          allowed_providers={"cloudflare"},
                          max_cost_minor=0,
                          allow_unknown_quota=True,
                      ),
                      snapshot=snapshot,
                  )
                  print(json.dumps({
                      "status": "SELECTED",
                      "candidate_count": len(cloudflare_resources),
                      "candidate_models": sorted({
                          str((item.get("metadata") or {}).get("model_id") or item.get("model_id"))
                          for item in cloudflare_resources
                          if ((item.get("metadata") or {}).get("model_id") or item.get("model_id"))
                      }),
                      "selected": {
                          "provider_id": selection.provider_id,
                          "provider_binding_id": selection.provider_binding_id,
                          "model_id": selection.model_id,
                          "unknown_quota": selection.unknown_quota,
                      },
                  }, ensure_ascii=False, indent=2, sort_keys=True))
              finally:
                  service.close()
          PY
