name: v2-provider-smoke

on:
  push:
    branches: [main, v2/bootstrap]
  pull_request:

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify exact checked-out HEAD
        run: python scripts/check_head.py --expected "$GITHUB_SHA"
      - run: mkdir -p artifacts
      - name: Compatibility provider smoke
        run: python -m pytest tests/v2/test_provider_exports.py -q --junitxml=artifacts/v2-provider-smoke-junit.xml
      - name: Upload v2 provider smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-provider-smoke-junit
          path: artifacts/v2-provider-smoke-junit.xml
