name: v2 tests

on:
  push:
    branches: [main, v2/bootstrap]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify exact checked-out HEAD
        run: python scripts/check_head.py --expected "$GITHUB_SHA"
      - run: mkdir -p artifacts
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q --junitxml=artifacts/v2-junit.xml
      - name: Upload v2 test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-junit
          path: artifacts/v2-junit.xml
