[pytest]
testpaths = tests/v2
python_files = test_*.py
pythonpath = src
addopts = -ra
markers =
    security: tests that verify authority and security boundaries (qualification gate, billing gate, protected-path policy, etc.)
    unit: self-contained unit tests with no persistent state
    e2e: end-to-end integration tests that hit real infrastructure

# v1 tests are historical regression material and must be invoked explicitly:
# python -m pytest tests
