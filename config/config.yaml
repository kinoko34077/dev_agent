# config/config.yaml

# ----------------------------------------
# dev_agent 設定ファイル（環境別に差替も可能）
# モデル選択、記憶管理、実行制御、再帰動作などを一元管理
# ----------------------------------------

model:  #デフォルト値
  name: gemini-2.0-flash             # 使用するモデル名（例：gemini-1.5-pro, gpt-4）
  api_key: GEMINI_API_KEY
  FunctionClient: gemini-2.0-flash 
  temperature: 0.5                   # 出力の創造性（0.0〜1.0）
  prompt_base_path: prompts/prompt_base.md  # ベースプロンプト（system指示文）

clients:
  thinker:
    api_key: GEMINI_API_KEY
    model_name: gemini-1.5-flash
    temperature: 0.7
    recent_turns: 4
  function:          # 関数呼出用
    api_key: GEMINI_API_KEY2
    model_name: gemini-2.0-flash
    temperature: 0.0
    tools: functions_schema
  recur:            # 再帰処理・内的対話用
    api_key: GEMINI_API_KEY
    model_name: gemini-2.0-flash
    temperature: 0.4
    recent_turns: 6

memory:
  max_tokens: 100000                 # メモリに積める最大トークン（approximate）
  recent_turns: 4                    # 直近の履歴ターン数（user→agentで1セット）

execution:
  safe_mode: true                    # True = ファイル実行や関数呼び出しを厳格に制御
  sandbox_path: sandbox/            # run_scriptなどで実行を許可するディレクトリ

# 再帰処理・内的対話設定
recursion:
  enabled: true                      # 再帰処理の有効/無効
  max_recursions: 3                  # 最大再帰回数
  recursion_delay: 2.0               # 再帰ターン間のsleep時間（秒単位）
  internal_dialogue:                 # 内的対話設定
    enabled: true
    max_history: 3                   # 保持する対話履歴の最大数
    client: "recur"                  # 使用するクライアント設定（clientsセクションのキー）
    roles:
      internal: "recur"              # 内部インスタンスのロール
      agent: "assistant"             # エージェントのロール

