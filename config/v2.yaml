# v2 Kernel policy reference / example (non-secret).
#
# Operation runtime does NOT load this file. It opens the persisted SQLite
# resource/budget configuration and accepts only explicit non-secret provider
# selection from environment variables or CLI flags. Hard-budget changes
# belong to BudgetAuthority and a deployment-owned protected configuration
# path; editing this reference file cannot change a running runtime policy.
# Provider secrets stay in environment/config adapters.
budget:
  currency: JPY
  hard_cap_minor: 10000
  recovery_reserve_minor: 1000
  period: monthly-utc
resources:
  observation_max_age_seconds: 300
  require_worst_case_price_for_paid_dispatch: true
router:
  privacy_first: true
  failover: true
survival:
  conserve_threshold_minor: 1000
scheduler:
  lease_seconds: 30
  maintenance_claims: false
recovery:
  mutation_requires_explicit_opt_in: true
