# config.yaml

model:
  name: gemini-1.5-flash #gemini-2.5-pro-exp-03-25は保留
  temperature: 0.5
  prompt_base_path: templates/prompt_base.md

memory:
  max_tokens: 100000  # 文脈保持できる最大トークン量（後で調整可能）
  recent_turns: 4     # フルで積み込む直近ターン数

execution:
  safe_mode: true     # run_scriptなどは厳格管理するモード
  sandbox_path: sandbox/  # 実行許可フォルダ

recursion:
  max_recursions: 3     # 再帰ターン最大回数
  recursion_delay: 2.0  # 再帰ターン間の待機秒数（秒単位）